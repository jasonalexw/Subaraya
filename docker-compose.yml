x-airflow-common: &airflow-common
  image: iqdamshidqi/airflow-pyspark:2.8.1
  environment:
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-meta-db/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-metropolia-local-airflow-secret-2026-change-for-production}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-metropolia-local-airflow-secret-2026-change-for-production}
    AIRFLOW_CONN_METROPOLIA_POSTGRES: postgresql://de_user:password123@target-postgres:5432/metropolia_warehouse
    DATA_ROOT: /opt/airflow/data
    JDBC_URL: jdbc:postgresql://target-postgres:5432/metropolia_warehouse
    JDBC_USER: de_user
    JDBC_PASSWORD: password123
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
    - ./sql:/opt/airflow/sql
    - ./models:/opt/airflow/models
  depends_on:
    airflow-meta-db:
      condition: service_healthy
    target-postgres:
      condition: service_healthy

services:
  target-postgres:
    image: postgres:15-alpine
    container_name: metropolia-target-postgres
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: metropolia_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - postgres_metropolia_warehouse:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d metropolia_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-meta-db:
    image: postgres:15-alpine
    container_name: metropolia-airflow-meta-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: metropolia-airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname Metropolia
      --role Admin
      --email admin@example.com || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: metropolia-airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: metropolia-airflow-scheduler
    command: airflow scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: metropolia-kafka
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:8.3.2
    container_name: metropolia-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >-
        /bin/kafka-topics --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic metropolia.events
        --partitions 1
        --replication-factor 1
    restart: "no"

  streaming-db-init:
    image: postgres:15-alpine
    container_name: metropolia-streaming-db-init
    depends_on:
      target-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - ./sql/init_streaming.sql:/opt/metropolia/init_streaming.sql:ro
    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -h
      - target-postgres
      - -U
      - ${POSTGRES_USER:-de_user}
      - -d
      - ${POSTGRES_DB:-metropolia_warehouse}
      - -f
      - /opt/metropolia/init_streaming.sql
    restart: "no"

  streaming-consumer:
    build:
      context: ./streaming
      dockerfile: Dockerfile.spark
    image: metropolia-streaming-consumer:latest
    container_name: metropolia-streaming-consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      streaming-db-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: metropolia.events
      POSTGRES_HOST: target-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metropolia_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-de_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      CHECKPOINT_DIR: /opt/metropolia/checkpoints/manual-v1
      TRIGGER_INTERVAL: ${STREAM_TRIGGER_INTERVAL:-2 seconds}
      SPARK_DRIVER_MEMORY: ${STREAM_SPARK_DRIVER_MEMORY:-768m}
      SPARK_EXECUTOR_MEMORY: ${STREAM_SPARK_EXECUTOR_MEMORY:-768m}
    volumes:
      - streaming_checkpoints:/opt/metropolia/checkpoints
    restart: unless-stopped

  streaming-producer:
    build:
      context: ./streaming
      dockerfile: Dockerfile.producer
    image: metropolia-manual-producer:latest
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: metropolia.events
    profiles:
      - manual
    restart: "no"

  streaming-producer-auto:
    build:
      context: ./streaming
      dockerfile: Dockerfile.producer
    image: metropolia-manual-producer:latest
    container_name: metropolia-streaming-producer-auto
    entrypoint: ["python", "automatic_producer.py"]
    depends_on:
      streaming-consumer:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: metropolia.events
      AUTO_STREAM_INTERVAL_SECONDS: ${AUTO_STREAM_INTERVAL_SECONDS:-5}
      AUTO_ACCIDENT_EVERY_CYCLES: ${AUTO_ACCIDENT_EVERY_CYCLES:-13}
      AUTO_RANDOM_SEED: ${AUTO_RANDOM_SEED:-2026}
    profiles:
      - auto
    restart: unless-stopped

volumes:
  postgres_metropolia_warehouse:
  airflow_metadata:
  streaming_checkpoints:
  kafka_data:
